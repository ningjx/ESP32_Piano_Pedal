name: Build and Release Firmware

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'arduino_src/**'
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force create tag and release based on FW_VERSION'
        required: false
        default: 'true'
        type: boolean

jobs:
  check-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract FW_VERSION from platformio.ini
        id: extract_version
        run: |
          # 从 platformio.ini 提取 FW_VERSION
          # platformio.ini 格式: -DFW_VERSION=\"1.2.0\"
          VERSION=$(grep "FW_VERSION" arduino_src/platformio.ini | sed 's/.*FW_VERSION=\\?"\([^"]*\)\\?".*/\1/')
          # 去除可能残留的反斜杠
          VERSION=$(echo "$VERSION" | tr -d '\\')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Check existing tags
        id: check_tag
        run: |
          VERSION="${{ steps.extract_version.outputs.version }}"
          TAG_NAME="v${VERSION}"
          
          # 检查 tag 是否存在
          if git tag -l | grep -q "^${TAG_NAME}$"; then
            echo "tag_exists=true" >> $GITHUB_OUTPUT
            echo "Tag ${TAG_NAME} already exists"
          else
            echo "tag_exists=false" >> $GITHUB_OUTPUT
            echo "Tag ${TAG_NAME} does not exist"
          fi
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Determine action
        id: determine_action
        run: |
          TAG_EXISTS="${{ steps.check_tag.outputs.tag_exists }}"
          FORCE_RELEASE="${{ github.event.inputs.force_release || 'false' }}"
          
          echo "Tag exists: ${TAG_EXISTS}"
          echo "Force release: ${FORCE_RELEASE}"
          
          if [ "$FORCE_RELEASE" = "true" ]; then
            # 手动触发，强制发布
            echo "Action: Force release requested"
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "should_release=true" >> $GITHUB_OUTPUT
          elif [ "$TAG_EXISTS" = "false" ]; then
            # Tag 不存在，需要创建并发布
            echo "Action: Tag does not exist, will create and release"
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "should_release=true" >> $GITHUB_OUTPUT
          else
            # Tag 已存在，跳过
            echo "Action: Tag already exists, skipping"
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "should_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Python
        if: steps.determine_action.outputs.should_build == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        if: steps.determine_action.outputs.should_build == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build firmware
        if: steps.determine_action.outputs.should_build == 'true'
        shell: bash
        run: |
          cd arduino_src
          pwd
          ls -la
          pio run -e esp32dev

      - name: Prepare firmware artifact
        if: steps.determine_action.outputs.should_build == 'true'
        run: |
          VERSION="${{ steps.extract_version.outputs.version }}"
          FIRMWARE_NAME="esp_pedal_v${VERSION}.bin"
          
          # 复制固件并重命名
          cp arduino_src/.pio/build/esp32dev/firmware.bin "${FIRMWARE_NAME}"
          
          echo "firmware_name=${FIRMWARE_NAME}" >> $GITHUB_OUTPUT
          ls -la "${FIRMWARE_NAME}"

      - name: Create tag and release
        if: steps.determine_action.outputs.should_release == 'true'
        run: |
          TAG_NAME="${{ steps.check_tag.outputs.tag_name }}"
          VERSION="${{ steps.extract_version.outputs.version }}"
          FIRMWARE_NAME="esp_pedal_v${VERSION}.bin"
          
          # 配置 git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 如果 tag 存在且强制发布，先删除远程 tag
          if [ "${{ steps.check_tag.outputs.tag_exists }}" = "true" ]; then
            echo "Deleting existing tag ${TAG_NAME}..."
            git push --delete origin "${TAG_NAME}" || true
            git tag -d "${TAG_NAME}" || true
          fi
          
          # 创建新 tag
          git tag "${TAG_NAME}"
          git push origin "${TAG_NAME}"
          
          echo "Created and pushed tag: ${TAG_NAME}"

      - name: Create GitHub Release
        if: steps.determine_action.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check_tag.outputs.tag_name }}
          name: Release ${{ steps.check_tag.outputs.tag_name }}
          body: |
            ## ESP32 Piano Pedal Firmware ${{ steps.check_tag.outputs.tag_name }}
            
            ### 固件信息
            - **版本**: ${{ steps.extract_version.outputs.version }}
            - **目标芯片**: ESP32-WROOM-32
            - **Flash 大小**: 4MB
            
            ### 烧录说明
            1. 下载 `esp_pedal_v${{ steps.extract_version.outputs.version }}.bin`
            2. 使用 ESP32 烧录工具烧录固件
            3. 烧录地址: `0x10000`
            
            ### 变更日志
            请查看 commit 历史了解详细变更。
          files: |
            esp_pedal_v${{ steps.extract_version.outputs.version }}.bin
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.determine_action.outputs.should_build }}" = "true" ]; then
            echo "✅ **Build Status**: Success" >> $GITHUB_STEP_SUMMARY
            echo "- **Version**: ${{ steps.extract_version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Tag**: ${{ steps.check_tag.outputs.tag_name }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Firmware**: esp_pedal_v${{ steps.extract_version.outputs.version }}.bin" >> $GITHUB_STEP_SUMMARY
            
            if [ "${{ steps.determine_action.outputs.should_release }}" = "true" ]; then
              echo "- **Release**: Created ✨" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "⏭️ **Build Status**: Skipped (tag already exists)" >> $GITHUB_STEP_SUMMARY
            echo "- **Current Version**: ${{ steps.extract_version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Tag**: ${{ steps.check_tag.outputs.tag_name }} (already exists)" >> $GITHUB_STEP_SUMMARY
          fi